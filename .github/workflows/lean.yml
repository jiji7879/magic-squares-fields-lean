name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check source hygiene and imports
        run: python3 scripts/check_source.py
      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://elan.lean-lang.org/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check pinned compiler and fetch dependency cache
        run: |
          lean --version
          lake --version
          lake exe cache get
          git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
      - name: Build project and compatibility modules
        run: |
          lake build
          lake build MagicSquares.CenterOne.SharpPowerExistence MagicSquares.CenterOne.SharpSquareExistence MagicSquares.Certificates.PolynomialSquareCertificate MagicSquares.MagicSquares.CenterOne.Admissible
      - name: Check endpoint axioms
        run: python3 scripts/check_axioms.py
      - name: Confirm dependency pins unchanged
        run: git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
